version: '3.8'

services:
  dons-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dons-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8001}
      - REACT_APP_BARAPAY_CLIENT_ID=${REACT_APP_BARAPAY_CLIENT_ID:-wjb7lzQVialbcwMNTPD1IojrRzPIIl}
    networks:
      - dons-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dons-frontend.rule=Host(`dons.local`)"
      - "traefik.http.routers.dons-frontend.entrypoints=web"
      - "traefik.http.services.dons-frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dons-network:
    driver: bridge
